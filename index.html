<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<header class="top">
  <div class="bullets" aria-hidden="true">
    <span style="--c:#EE352E">M</span><span style="--c:#FF6319">B</span><span style="--c:#B933AD">Q</span><span style="--c:#2fbf71">X</span><span style="--c:#5b8cff">S</span>
  </div>
  <h1>Listing Predictor</h1>
  <p>Describe a New York listing and let the model score it.</p>
</header>

<main class="layout">
  <form id="form" novalidate>
    <section class="card">
      <h2>Where is it?</h2>
      <div class="boroughs" id="boroughs" role="radiogroup" aria-label="Borough"></div>
      <div class="row">
        <label class="field">Neighbourhood
          <select id="neighbourhood" required disabled><option value="">Pick a borough first</option></select>
          <small class="err"></small>
        </label>
      </div>
      <div class="row two">
        <label class="field">Latitude
          <input id="latitude" type="number" step="any" min="-90" max="90" required><small class="err"></small>
        </label>
        <label class="field">Longitude
          <input id="longitude" type="number" step="any" min="-180" max="180" required><small class="err"></small>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>The listing</h2>
      <div class="row two">
        <label class="field">Price per night ($)
          <input id="price" type="number" step="any" min="1" value="120" required><small class="err"></small>
        </label>
        <label class="field">Minimum nights
          <input id="minimum_nights" type="number" min="1" max="365" value="2" required><small class="err"></small>
        </label>
      </div>
      <label class="field">Availability <output id="availability_out">180</output> days a year
        <input id="availability_365" type="range" min="0" max="365" value="180">
      </label>
      <label class="field">Host listings <output id="host_out">1</output>
        <input id="calculated_host_listings_count" type="range" min="0" max="100" value="1">
      </label>
    </section>

    <section class="card">
      <h2>Guest activity</h2>
      <div class="row two">
        <label class="field">Total reviews
          <input id="number_of_reviews" type="number" min="0" value="10" required><small class="err"></small>
        </label>
        <label class="field">Reviews per month
          <input id="reviews_per_month" type="number" step="0.01" min="0" value="0.5" required><small class="err"></small>
        </label>
      </div>
    </section>

    <div class="actions">
      <button type="submit" id="go" class="primary"><span class="label">Run prediction</span><span class="spin" aria-hidden="true"></span></button>
      <button type="button" id="sample" class="ghost">Try a sample</button>
    </div>
  </form>

  <aside class="result" id="result" aria-live="polite">
    <div class="empty" id="empty">
      <div class="ring placeholder"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/></svg><b>?</b></div>
      <p>Fill in the form and run a prediction. The result appears here.</p>
    </div>
    <div class="filled" id="filled" hidden>
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg><b id="pct">0%</b></div>
      <p class="verdict">Predicted: <strong id="verdict">-</strong></p>
      <p class="sub">Model confidence</p>
      <ul class="bars" id="bars"></ul>
    </div>
    <div class="error" id="error" hidden></div>
  </aside>
</main>

<script src="script.js"></script>
</body>
</html>
